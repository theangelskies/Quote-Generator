<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="quote-box">
        <h2 id="quote">Click the button to get a quote</h2>
        <p id="author"></p>

        <button id="btn">New Quote</button>
        <form id="quoteForm">
          <h3>Add Your Own Quote</h3>

          <input type="text" id="newQuote" placeholder="Enter quote" />

          <input type="text" id="newAuthor" placeholder="Enter author" />

          <button type="submit">Add Quote</button>
        </form>

        <p id="message"></p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
